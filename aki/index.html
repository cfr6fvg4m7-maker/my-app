<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f9d55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="空き時間">
  <title>空き時間</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>空き時間</h1>
    <div class="topbar-actions">
      <button id="btn-import" class="btn" type="button">↻ 取り込む</button>
      <button id="btn-settings" class="btn icon" type="button" aria-label="設定">⚙</button>
    </div>
  </header>

  <main>
    <section id="empty" class="card empty" hidden>
      <h2>TimeTreeの予定から<br>空き時間を表示します</h2>
      <ol>
        <li><a href="bookmarklet.html">ブックマーク「TimeTree取込」を設定</a>(最初に1回)</li>
        <li>上の「取り込む」から、TimeTreeの予定を取り込む</li>
      </ol>
    </section>

    <div id="main-ui" hidden>
      <section id="summary" class="summary"></section>

      <div class="seg" role="tablist">
        <button type="button" data-view="week" class="on">週</button>
        <button type="button" data-view="month">月</button>
        <button type="button" data-view="list">リスト</button>
        <button type="button" data-view="add">＋ 予定</button>
      </div>

      <section id="panel-week" class="panel"></section>
      <section id="panel-month" class="panel" hidden></section>
      <section id="panel-list" class="panel" hidden></section>
      <section id="panel-add" class="panel" hidden>
        <div id="add-box"></div>
        <div id="add-extra"></div>
      </section>
    </div>
  </main>

  <dialog id="sheet" class="sheet">
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="btn icon" data-close aria-label="閉じる">✕</button>
    </div>
    <div id="sheet-body"></div>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="../calendar.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
