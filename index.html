<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="課題">
  <title>manaba課題</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>未提出課題</h1>
    <div class="topbar-actions">
      <button id="btn-import" class="btn primary">manabaから取り込む</button>
    </div>
  </header>

  <main>
    <p id="summary" class="summary"></p>
    <ul id="list-open" class="task-list"></ul>
    <p id="empty" class="empty" hidden>
      課題はありません。<br>
      「manabaから取り込む」か、下の「＋ 手動で追加」から登録できます。
    </p>

    <details id="done-section" class="done-section" hidden>
      <summary>完了済み <span id="done-count"></span></summary>
      <ul id="list-done" class="task-list"></ul>
    </details>

    <section class="tools">
      <button id="btn-add" class="btn">＋ 手動で追加</button>
      <a class="btn link" href="bookmarklet.html">ブックマークレットの設定</a>
    </section>
    <p id="last-import" class="muted small"></p>
  </main>

  <!-- 取り込みダイアログ -->
  <dialog id="dlg-import">
    <form method="dialog" class="dlg">
      <h2>manabaから取り込む</h2>
      <ol class="small steps">
        <li>manabaの未提出課題一覧ページでブックマークレットを実行</li>
        <li>表示された「コピー」ボタンを押す</li>
        <li>ここに戻って「貼り付け」を押す</li>
      </ol>
      <button type="button" id="btn-paste" class="btn primary wide">クリップボードから貼り付け</button>
      <textarea id="import-text" rows="4" placeholder="うまくいかないときは、ここに長押しで貼り付けてください"></textarea>
      <div id="import-preview" class="preview small"></div>
      <div class="dlg-actions">
        <button value="cancel" class="btn">キャンセル</button>
        <button type="button" id="btn-import-apply" class="btn primary" disabled>取り込む</button>
      </div>
    </form>
  </dialog>

  <!-- 手動追加ダイアログ -->
  <dialog id="dlg-add">
    <form method="dialog" class="dlg" id="form-add">
      <h2>課題を手動で追加</h2>
      <label>タイトル<input name="title" required></label>
      <label>コース(任意)<input name="course"></label>
      <label>締切<input name="end" type="datetime-local" required></label>
      <label>リンク(任意)<input name="url" type="url" placeholder="https://"></label>
      <div class="dlg-actions">
        <button value="cancel" class="btn" formnovalidate>キャンセル</button>
        <button type="submit" value="ok" class="btn primary">追加</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
